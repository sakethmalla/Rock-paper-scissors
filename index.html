<!DOCTYPE html>
<html>
    <head>
        <title>Game</title>
        <link rel="stylesheet" href="./rock-paper-scissors.css">
    </head>
    <body>
        <p class="main-heading">Rock Paper Scissors</p>
        <button onclick="playGame('rock');" class="rock"><img src="./rock-emoji.png" class="move"></button>
        <button onclick="playGame('paper')" class="paper"><img src="./paper-emoji.png" class="move"></button>
        <button onclick="playGame('scissors')" class="scissors"> <img src="./scissors-emoji.png" class="move"></button>
        <p class="js-result result"></p>
        <p class="js-move"></p>
        <p class="js-paragraph"></p>
        <button onclick="
        score.wins = 0;
        score.losses = 0;
        score.Ties = 0;
        localStorage.removeItem('score');
        updateScoreElement();
         " class="reset-button">Reset Score</button>
        <script src="./rock-paper-scissors.js"></script>
        </body>
        </html>
